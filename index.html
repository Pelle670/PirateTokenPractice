<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Third-Person Movement Demo</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#87b7e8;font-family:system-ui,sans-serif}
canvas{display:block}
#hud{position:fixed;left:14px;bottom:14px;color:#fff;background:rgba(10,20,40,.55);padding:10px 14px;border-radius:10px;font-size:13px;line-height:1.7;pointer-events:none}
#hud b{color:#ffd54a}
#state{position:fixed;top:14px;left:16px;color:#fff;font-weight:800;font-size:20px;letter-spacing:.05em;text-transform:uppercase;text-shadow:0 2px 6px #0007;pointer-events:none}
#prompt{position:fixed;left:50%;bottom:18%;transform:translateX(-50%);color:#fff;text-align:center;font-weight:700;text-shadow:0 2px 6px #000a;display:none;pointer-events:none}
#barwrap{width:160px;height:8px;background:#0006;border-radius:4px;margin:8px auto 0;overflow:hidden}
#bar{height:100%;width:0;background:#ffd54a}
#start{position:fixed;inset:0;display:none;z-index:5;align-items:center;justify-content:center;background:rgba(10,20,40,.55);color:#fff;font-size:22px;font-weight:700;cursor:pointer}
#select{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(#1b2a4a,#3b5b8f);color:#fff}
#select h1{margin:0 0 6px;font-size:30px}#select p{margin:0 0 24px;opacity:.8}
#cards{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.card{width:150px;padding:18px 10px;border-radius:14px;background:rgba(255,255,255,.1);text-align:center;cursor:pointer;transition:.15s;border:2px solid transparent}
.card:hover{transform:translateY(-6px);background:rgba(255,255,255,.2);border-color:#ffd54a}
.card .sw{width:64px;height:64px;border-radius:50%;margin:0 auto 10px}.card span{display:block;opacity:.7;font-size:13px}
</style>
</head>
<body>
<div id="state">idle</div>
<div id="prompt"><div>Hold <span style="color:#ffd54a">E</span> to open chest</div><div id="barwrap"><div id="bar"></div></div></div>
<div id="hud">
<b>WASD</b> move &nbsp; <b>Mouse</b> look<br>
<b>Shift</b> sprint &nbsp; <b>Z</b> walk &nbsp; <b>Space</b> jump<br>
<b>C</b> crouch &nbsp; <b>C while sprinting</b> slide<br>
<b>Space near a wall</b> mantle<br>
<b>Hold E</b> open chest &nbsp; <b>Esc</b> release mouse
</div>
<div id="start">Paused - click to resume</div>
<div id="select"><h1>Choose your avatar</h1><p>Pick a character to start</p><div id="cards"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
// ---------- Tuning (units: metres, seconds) ----------
const TUNING = {
  walk: 3.0, run: 6.2, sprint: 9.0, crouch: 2.6,
  slideStart: 11.5, slideFriction: 8.5, slideMinSpeed: 3.4, slideMinEntry: 6.5,
  jump: 7.6, gravity: 24, groundAccel: 16, airAccel: 3.2,
  chestTime: 1.1, chestRange: 2.3, camDist: 3.6, camShoulder: 0.7, sens: 0.0022
};

// ---------- Renderer / scene ----------
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87b7e8);
scene.fog = new THREE.Fog(0x87b7e8, 40, 140);
const cam = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 300);
scene.add(new THREE.HemisphereLight(0xffffff, 0x4a7a3a, 0.85));
const sun = new THREE.DirectionalLight(0xfff2d0, 0.9);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-30, right:30, top:30, bottom:-30, far:120});
scene.add(sun, sun.target);

const M = c => new THREE.MeshStandardMaterial({color:c, roughness:.7});
const ground = new THREE.Mesh(new THREE.PlaneGeometry(400,400), M(0x5aa84a));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(400, 200, 0x4f9a40, 0x4f9a40); grid.position.y = .01; scene.add(grid);

// ---------- Collision circles (trees, chests) ----------
const colliders = [];
let seed = 7; const rnd = () => (seed = (seed*16807) % 2147483647) / 2147483647;
for (let i = 0; i < 34; i++) {
  const a = rnd()*Math.PI*2, r = 12 + rnd()*45, x = Math.cos(a)*r, z = Math.sin(a)*r;
  const t = new THREE.Group(), h = 2 + rnd()*2;
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(.25,.32,h,8), M(0x6b4a2b)); trunk.position.y = h/2;
  const top = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3.2, 8), M(0x2f7a3a)); top.position.y = h + 1.1;
  trunk.castShadow = top.castShadow = true; t.add(trunk, top); t.position.set(x,0,z); scene.add(t);
  colliders.push({x, z, r:.5});
}

// ---------- Chests ----------
const chests = [];
function makeChest(x, z, ry) {
  const g = new THREE.Group();
  const gold = new THREE.MeshStandardMaterial({color:0xf2b632, metalness:.6, roughness:.35, emissive:0x553300, emissiveIntensity:.5});
  const base = new THREE.Mesh(new THREE.BoxGeometry(.9,.5,.6), M(0x7a4a22)); base.position.y = .25;
  const band = new THREE.Mesh(new THREE.BoxGeometry(.94,.1,.64), gold); band.position.y = .3;
  const lidPivot = new THREE.Group(); lidPivot.position.set(0,.5,-.3);
  const lidGeo = new THREE.BoxGeometry(.9,.28,.6); lidGeo.translate(0,.14,.3);
  const lid = new THREE.Mesh(lidGeo, M(0x8a5628));
  const lidBand = new THREE.Mesh(new THREE.BoxGeometry(.94,.06,.64), gold); lidBand.position.set(0,.04,.3);
  const lock = new THREE.Mesh(new THREE.BoxGeometry(.14,.18,.06), gold); lock.position.set(0,.45,.32);
  lidPivot.add(lid, lidBand); g.add(base, band, lidPivot, lock);
  g.traverse(o => o.castShadow = true);
  const light = new THREE.PointLight(0xffc040, 1.6, 6); light.position.y = .9; g.add(light);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,7,12,1,true),
    new THREE.MeshBasicMaterial({color:0xffc040, transparent:true, opacity:.14, blending:THREE.AdditiveBlending, depthWrite:false}));
  beam.position.y = 3.5; g.add(beam);
  g.position.set(x,0,z); g.rotation.y = ry; scene.add(g);
  const c = {g, lidPivot, light, beam, x, z, open:0, opened:false};
  chests.push(c); colliders.push({x, z, r:.65});
}
[[0,14],[-11,10],[12,7],[-7,-12],[16,-9],[4,-18]].forEach(([x,z]) => makeChest(x, z, Math.atan2(-x, 8-z)));

// Climbable crates / walls (AABB). h = top height.
const boxes = [];
[[6,5,1.2,1.2,1.4,0xb5835a],[-6,8,2.2,.4,2.0,0x8d99ae],[-3,-5,1,1,1.8,0xc08552],[10,-4,1.5,.5,2.3,0x6c757d],[-14,0,1,2,1.5,0xa68a64]].forEach(([x,z,hx,hz,h,c]) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(hx*2,h,hz*2), M(c)); m.position.set(x,h/2,z);
  m.castShadow = m.receiveShadow = true; scene.add(m); boxes.push({x,z,hx,hz,h});
});
function groundAt(p) {
  let g = 0;
  for (const b of boxes) if (Math.abs(p.x-b.x) < b.hx+.2 && Math.abs(p.z-b.z) < b.hz+.2 && p.y >= b.h-.35) g = Math.max(g, b.h);
  return g;
}
function findMantle() {
  const fx = Math.sin(P.face), fz = Math.cos(P.face), px = P.pos.x + fx*.7, pz = P.pos.z + fz*.7;
  for (const b of boxes) if (Math.abs(px-b.x) < b.hx+.1 && Math.abs(pz-b.z) < b.hz+.1) {
    const rise = b.h - P.pos.y;
    if (rise > .5 && rise < 2.4) return {b, fx, fz};
  }
  return null;
}

// Loot popped from chests
const loot = [];
const RARITY = [0x9aa0a6, 0x4cc24c, 0x3d8bff, 0xa855f7, 0xffb020];
function spawnLoot(c) {
  for (let i = 0; i < 3; i++) {
    const col = RARITY[Math.min(4, Math.floor(Math.pow(Math.random(), 1.6)*5))];
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(.2),
      new THREE.MeshStandardMaterial({color:col, emissive:col, emissiveIntensity:.8}));
    m.position.set(c.x, .6, c.z);
    scene.add(m);
    const a = (i/3)*Math.PI*2 + Math.random();
    loot.push({m, vx:Math.cos(a)*1.6, vz:Math.sin(a)*1.6, vy:5, life:7, rest:false});
  }
}

// ---------- Character rig (original design, procedural) ----------
const hero = new THREE.Group(); scene.add(hero);
const body = new THREE.Group(); hero.add(body);
const hips = new THREE.Group(); hips.position.y = .95; body.add(hips);
const torso = new THREE.Group(); hips.add(torso);
const cShirt = M(0x2d6cdf), cPants = M(0x2b2f3a), cSkin = M(0xe0ac84), cHelm = M(0xe8553d), cAcc = M(0xffd54a);
function box(w,h,d,mat,x,y,z,parent,pivotTop) {
  const g = new THREE.BoxGeometry(w,h,d); if (pivotTop) g.translate(0,-h/2,0);
  const m = new THREE.Mesh(g, mat); m.position.set(x,y,z); m.castShadow = true; parent.add(m); return m;
}
box(.5,.6,.28,cShirt,0,.3,0,torso);
box(.52,.12,.3,cAcc,0,.08,0,torso);          // belt
box(.34,.42,.14,M(0x444b5c),0,.32,-.21,torso); // backpack
const head = new THREE.Group(); head.position.y = .72; torso.add(head);
box(.3,.3,.3,cSkin,0,.15,0,head);
box(.34,.16,.34,cHelm,0,.34,0,head);          // helmet top
box(.3,.1,.1,M(0x111820),0,.2,.15,head);      // visor
function makeArm(side) {
  const sh = new THREE.Group(); sh.position.set(side*.33,.55,0); torso.add(sh);
  box(.14,.3,.14,cShirt,0,0,0,sh,true);
  const el = new THREE.Group(); el.position.y = -.3; sh.add(el);
  box(.12,.28,.12,cSkin,0,0,0,el,true);
  box(.14,.12,.14,cAcc,0,-.3,0,el);            // glove
  return {sh, el};
}
function makeLeg(side) {
  const hp = new THREE.Group(); hp.position.set(side*.14,0,0); hips.add(hp);
  box(.18,.45,.18,cPants,0,0,0,hp,true);
  const kn = new THREE.Group(); kn.position.y = -.45; hp.add(kn);
  box(.16,.4,.16,cPants,0,0,0,kn,true);
  box(.18,.1,.28,M(0x1b1b1b),0,-.42,.04,kn);   // boot
  return {hp, kn};
}
const armL = makeArm(1), armR = makeArm(-1), legL = makeLeg(1), legR = makeLeg(-1);

// ---------- Input ----------
const keys = {}; let jumpP = false, crouchP = false, locked = false, camYaw = 0, camPitch = .25;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (!e.repeat) { if (e.code === 'Space') jumpP = true; if (e.code === 'KeyC') crouchP = true; }
  if (e.code === 'Space') e.preventDefault();
});
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
// ---------- Avatars: GLB from ./models/ (CC0), falls back to built-in rig ----------
const AVATARS = [
  {name:'Jax',    tag:'Male',   file:'models/male1.glb',   shirt:0x2d6cdf, pants:0x2b2f3a, helm:0xe8553d, skin:0xe0ac84},
  {name:'Marcus', tag:'Male',   file:'models/male2.glb',   shirt:0x2f9e44, pants:0x3a3a3a, helm:0x222222, skin:0x8d5a3b},
  {name:'Aria',   tag:'Female', file:'models/female1.glb', shirt:0xd6336c, pants:0x343a40, helm:0xf2c14e, skin:0xf1c9a5},
  {name:'Zoe',    tag:'Female', file:'models/female2.glb', shirt:0x7048e8, pants:0x1c1c28, helm:0x5c3a21, skin:0xc68642}
];
let started = false, mixer = null, clips = [], curAct = null, avatarModel = null;
const modelRoot = new THREE.Group(); body.add(modelRoot);
function setAvatar(a) {
  cShirt.color.set(a.shirt); cPants.color.set(a.pants); cHelm.color.set(a.helm); cSkin.color.set(a.skin);
  modelRoot.clear(); avatarModel = null; mixer = null; curAct = null; hips.visible = true;
  new THREE.GLTFLoader().load(a.file, g => {
    const m = g.scene, bb = new THREE.Box3().setFromObject(m), sc = 1.8 / (bb.max.y - bb.min.y);
    m.scale.setScalar(sc); m.position.y = -bb.min.y * sc;
    m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.frustumCulled = false; } });
    modelRoot.add(m); avatarModel = m; hips.visible = false;
    mixer = new THREE.AnimationMixer(m); clips = g.animations;
  }, undefined, () => console.warn('Model not found, using built-in character:', a.file));
}
const ANIM = {idle:[/idle/i], walk:[/walk/i,/run/i], run:[/^(?!.*(jump|slide)).*run/i,/jog/i,/walk/i], sprint:[/sprint/i,/run/i],
  jump:[/jump/i], fall:[/fall/i,/jump/i], crouch:[/crouch.*idle/i,/crouch/i,/idle/i], crouchwalk:[/crouch.*(walk|fwd)/i,/crouch/i,/walk/i],
  slide:[/slide/i], chest:[/interact|pick|open/i,/crouch/i,/idle/i], mantle:[/climb|mantle|vault/i,/jump/i]};
function driveModel(s, hs, dt) {
  if (!avatarModel) return;
  let clip = null, dedicated = false;
  (ANIM[s] || ANIM.idle).forEach((re, i) => { if (!clip) { clip = clips.find(c => re.test(c.name)); dedicated = i === 0 && !!clip; } });
  clip = clip || clips.find(c => /idle/i.test(c.name)) || clips[0];
  if (clip && mixer) {
    const act = mixer.clipAction(clip);
    if (act !== curAct) { act.reset().fadeIn(.2).play(); if (curAct) curAct.fadeOut(.2); curAct = act; }
    act.timeScale = s === 'sprint' && !/sprint/i.test(clip.name) ? 1.3 : s === 'walk' && /run/i.test(clip.name) ? .6 : 1;
  }
  if (mixer) mixer.update(dt);
  // procedural fallback when the pack has no dedicated clip
  const k = 1 - Math.exp(-12*dt);
  const tilt = !dedicated && s === 'slide' ? -.9 : !dedicated && s === 'chest' ? .45 : 0;
  const sq = !dedicated && (s === 'crouch' || s === 'crouchwalk') ? .8 : 1;
  modelRoot.rotation.x += (tilt - modelRoot.rotation.x) * k; modelRoot.scale.y += (sq - modelRoot.scale.y) * k;
}
const startEl = document.getElementById('start');
startEl.addEventListener('click', () => renderer.domElement.requestPointerLock());
document.addEventListener('pointerlockchange', () => {
  locked = document.pointerLockElement === renderer.domElement;
  startEl.style.display = (started && !locked) ? 'flex' : 'none';
});
AVATARS.forEach(a => {
  const d = document.createElement('div'); d.className = 'card';
  d.innerHTML = `<div class="sw" style="background:#${a.shirt.toString(16).padStart(6,'0')}"></div><b>${a.name}</b><span>${a.tag}</span>`;
  d.onclick = () => { setAvatar(a); started = true; document.getElementById('select').style.display = 'none'; renderer.domElement.requestPointerLock(); };
  document.getElementById('cards').appendChild(d);
});
addEventListener('mousemove', e => {
  if (!locked) return;
  camYaw -= e.movementX * TUNING.sens;
  camPitch = Math.max(-.35, Math.min(1.1, camPitch + e.movementY * TUNING.sens));
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight); cam.aspect = innerWidth/innerHeight; cam.updateProjectionMatrix();
});

// ---------- Player state ----------
const P = {pos:new THREE.Vector3(0,0,6), vel:new THREE.Vector3(), face:0, grounded:true,
  crouch:false, sliding:false, slideSpd:0, slideDir:new THREE.Vector2(), ph:0, chest:null, prog:0, state:'idle'};
const pose = {hipY:.95, pitch:0, lean:0, tL:0, tR:0, kL:0, kR:0, aL:0, aR:0, eL:0, eR:0, armZ:0};
const lerpAng = (a,b,t) => a + ((((b-a+Math.PI)%(Math.PI*2))+Math.PI*2)%(Math.PI*2) - Math.PI) * t;
const stateEl = document.getElementById('state'), promptEl = document.getElementById('prompt'), barEl = document.getElementById('bar');
let fov = 70, time = 0;

function endSlide() { P.sliding = false; P.crouch = !!keys.KeyC; }

function update(dt) {
  time += dt;
  const T = TUNING;
  // input -> world direction relative to camera
  const ix = (keys.KeyD?1:0) - (keys.KeyA?1:0), iz = (keys.KeyW?1:0) - (keys.KeyS?1:0);
  const fx = Math.sin(camYaw), fz = Math.cos(camYaw), rx = -fz, rz = fx;
  let dx = fx*iz + rx*ix, dz = fz*iz + rz*ix; const len = Math.hypot(dx,dz);
  if (len > 0) { dx /= len; dz /= len; }
  const moving = len > 0;

  // chest interaction
  let near = null, nd = T.chestRange;
  for (const c of chests) if (!c.opened) { const d = Math.hypot(c.x-P.pos.x, c.z-P.pos.z); if (d < nd) { nd = d; near = c; } }
  const opening = !!(near && keys.KeyE && P.grounded && !P.sliding);
  if (opening) { P.chest = near; P.prog += dt / T.chestTime;
    if (P.prog >= 1) { near.opened = true; spawnLoot(near); P.prog = 0; P.chest = null; } }
  else { P.prog = Math.max(0, P.prog - dt*3); if (P.prog === 0) P.chest = null; }
  const busy = opening && !near?.opened;

  // sprint / crouch / slide
  const sprint = !busy && !P.sliding && (keys.ShiftLeft || keys.ShiftRight) && iz > 0 && moving;
  const hSpd = Math.hypot(P.vel.x, P.vel.z);
  if (crouchP && !P.sliding) {
    if (P.grounded && hSpd > T.slideMinEntry && (sprint || hSpd > T.run + 0.5)) {
      P.sliding = true; P.crouch = true; P.slideSpd = Math.max(T.slideStart, hSpd * 1.1);
      P.slideDir.set(P.vel.x/hSpd, P.vel.z/hSpd);
    }
  }
  if (!P.sliding) {
    if (keys.KeyC) P.crouch = true;
    else if (P.crouch) P.crouch = false;
  }
  if (sprint && P.crouch) P.crouch = false;
  crouchP = false;

  // jump
  if (jumpP && !busy && !P.mantle) {
    const mv = findMantle();
    if (mv) {  // Space near a wall: mantle up onto it
      const b = mv.b, tx = Math.min(b.x+b.hx-.3, Math.max(b.x-b.hx+.3, P.pos.x + mv.fx*1.15));
      const tz = Math.min(b.z+b.hz-.3, Math.max(b.z-b.hz+.3, P.pos.z + mv.fz*1.15));
      P.mantle = {t:0, from:P.pos.clone(), to:new THREE.Vector3(tx, b.h, tz), face:Math.atan2(mv.fx, mv.fz), fx:mv.fx, fz:mv.fz};
      if (P.sliding) endSlide(); P.crouch = false;
    } else if (P.grounded) { P.vel.y = T.jump; P.grounded = false; if (P.sliding) endSlide(); }
  }
  jumpP = false;

  // horizontal velocity
  if (P.sliding) {
    P.slideSpd -= T.slideFriction * dt;
    if (P.slideSpd < T.slideMinSpeed || !P.grounded) endSlide();
    else { P.vel.x = P.slideDir.x * P.slideSpd; P.vel.z = P.slideDir.y * P.slideSpd; }
  } else {
    let tgt = 0;
    if (!busy && moving) tgt = P.crouch ? T.crouch : keys.KeyZ ? T.walk : sprint ? T.sprint : T.run;
    const a = 1 - Math.exp(-(P.grounded ? T.groundAccel : T.airAccel) * dt);
    P.vel.x += (dx*tgt - P.vel.x) * a; P.vel.z += (dz*tgt - P.vel.z) * a;
  }
  // gravity + move
  if (P.mantle) {
    const m = P.mantle, ez = x => x*x*(3-2*x); m.t += dt/.6; const u = Math.min(1, m.t);
    const up = ez(Math.min(1, u/.6)), fw = ez(Math.max(0, (u-.5)/.5));
    P.pos.set(m.from.x + (m.to.x-m.f
